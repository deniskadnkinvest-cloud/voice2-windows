name: Build Voice2 Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build whisper.cpp (main.exe)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp whisper-src
          cd whisper-src
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build --config Release --target main -j4
          Copy-Item build\bin\Release\main.exe ..\whisper-main.exe -Force

      - name: Download Whisper base model
        shell: pwsh
        run: |
          $url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"
          Invoke-WebRequest -Uri $url -OutFile ggml-base.bin

      - name: Publish Voice2.exe
        shell: pwsh
        run: |
          dotnet publish src-win/Voice2Win.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist

      - name: Copy whisper.exe and model
        shell: pwsh
        run: |
          Copy-Item whisper-main.exe dist\whisper.exe -Force
          Copy-Item ggml-base.bin dist\ggml-base.bin -Force

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Voice2.exe, dist\whisper.exe, dist\ggml-base.bin `
            -DestinationPath Voice2-Windows-Personal.zip -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Voice2 Windows ${{ github.ref_name }}
          body: |
            Personal build — безлимит, без регистрации, без оплаты.

            **Установка:**
            1. Распакуй ZIP — все три файла в одну папку
            2. Запусти `Voice2.exe`
            3. При первом запуске разреши микрофон
            4. Зажми **Right Ctrl** и говори
          files: Voice2-Windows-Personal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
